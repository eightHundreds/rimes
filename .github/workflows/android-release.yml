name: Android Release

on:
  push:
    tags:
      # GitHub tag filters are globs, so the build job validates the exact
      # android-vX.Y.Z[-suffix] shape again before it is allowed to publish.
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: assembleRelease APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      is_release: ${{ steps.version.outputs.IS_RELEASE }}
      has_formal_signing: ${{ steps.signing.outputs.HAS_RELEASE_SIGNING }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # A workflow_dispatch run (e.g. to validate this pipeline in CI) builds
      # and uploads the APK artifact but never publishes a Release. Only a
      # pushed android-v* tag does; the exact shape is re-validated here so a
      # loose tag glob match can never slip through as a real release.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^android-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?)$ ]]; then
              echo "Android release tags must be exactly android-vX.Y.Z[-suffix]: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}"
            IS_RELEASE=true
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            IS_RELEASE=false
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "IS_RELEASE=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (publish=$IS_RELEASE)"

      - name: Set up JDK 17
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch pinned prebuilt librime toolchain
        run: platforms/android/scripts/fetch-prebuilt.sh

      - name: Build stock OpenCC data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          platforms/android/scripts/build-opencc-data.sh

      - name: Verify the staged rime-data closure
        run: python3 scripts/platform-preview/preview.py verify --repo-root .

      # A formal keystore is optional. When every RIMES_ANDROID_RELEASE_*
      # secret below is configured, the decoded keystore is wired into
      # gradle.properties via environment variables that
      # platforms/android/app/build.gradle.kts reads, and assembleRelease
      # signs with it. Otherwise the build falls back to the stock Gradle
      # debug keystore (see platforms/android/README.md) so this pipeline
      # never fails for lack of a production key.
      - name: Decode formal release keystore (optional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RIMES_ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/rimes-android-release.keystore"
            base64 --decode <<<"$KEYSTORE_BASE64" >"$KEYSTORE_PATH"
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
            echo "Formal release keystore decoded; assembleRelease will sign with it."
          else
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_OUTPUT"
            echo "No RIMES_ANDROID_RELEASE_KEYSTORE_BASE64 secret; assembleRelease falls back to the debug keystore. See platforms/android/README.md to add real signing."
          fi

      - name: Build release APK and run JVM unit tests
        working-directory: platforms/android
        env:
          RIMES_ANDROID_RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.KEYSTORE_PATH }}
          RIMES_ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RIMES_ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RIMES_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.RIMES_ANDROID_RELEASE_KEY_ALIAS }}
          RIMES_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.RIMES_ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ steps.signing.outputs.KEYSTORE_PATH }}"

      - name: Verify and stage the release APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.HAS_RELEASE_SIGNING }}
        run: |
          set -euo pipefail
          SRC="platforms/android/app/build/outputs/apk/release/app-release.apk"
          [[ -f "$SRC" && ! -L "$SRC" && -s "$SRC" ]] || {
            echo "Missing or empty release APK: $SRC" >&2
            exit 1
          }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$SRC"

          OUT_DIR="$RUNNER_TEMP/rimes-android-release-out"
          mkdir -p "$OUT_DIR"
          APK_NAME="RIMES-Android-${VERSION}.apk"
          cp "$SRC" "$OUT_DIR/$APK_NAME"
          (cd "$OUT_DIR" && shasum -a 256 "$APK_NAME" >"$APK_NAME.sha256")
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "----- release APK -----"
          ls -la "$OUT_DIR"
          if [[ "$HAS_RELEASE_SIGNING" != "true" ]]; then
            echo "::notice title=Debug-signed APK::No formal keystore secrets were configured; this APK is signed with the Gradle debug key, not a production key. See platforms/android/README.md."
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: rimes-android-release-${{ steps.version.outputs.VERSION }}
          path: ${{ runner.temp }}/rimes-android-release-out/*
          if-no-files-found: error
          retention-days: 14

  publish_release:
    name: Publish GitHub Release
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release APK artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: rimes-android-release-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/rimes-android-release-out

      - name: Refuse to replace an existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace assets: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          HAS_RELEASE_SIGNING: ${{ needs.build.outputs.has_formal_signing }}
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/rimes-android-release-out"
          if [[ "$HAS_RELEASE_SIGNING" == "true" ]]; then
            SIGNING_NOTE='APK 已使用配置的正式发布 keystore 签名。'
          else
            SIGNING_NOTE='⚠️ 本次构建未配置正式签名 secrets，APK 由 Gradle debug key 签名，仅验证发布流水线本身，不建议作为生产分发使用。'
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$ASSET_DIR"/* \
            --verify-tag \
            --title "RIMES Android ${VERSION}" \
            --notes-file - <<EOF
          ## RIMES Android ${VERSION}

          原生 Android 输入法（RIMES）的预编译 APK，由本次 tag 触发的 CI 流水线
          （\`assembleRelease\`）真实构建产出。

          - **签名**：${SIGNING_NOTE} 如何切换到正式签名 secrets 见
            \`platforms/android/README.md\` 的“发布签名”一节。
          - 安装前建议用随附的 \`.sha256\` 文件核对下载的 APK。
          - 已打包架构（ABI）：arm64-v8a、x86_64（与仓库默认 \`rimesAbis\` 一致）。
          - 未对齐 macOS 的能力见 \`platforms/android/README.md\` 的“未对齐项”。
          EOF
